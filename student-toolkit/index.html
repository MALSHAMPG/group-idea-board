<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCSC Student Toolkit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo-container">
            <!-- Placeholder for UCSC Logo -->
            <img src="https://img.icons8.com/ios-filled/50/FFD700/university.png" alt="UCSC Logo" class="university-logo">
            <span class="logo-text">UCSC Toolkit</span>
        </div>
        <ul class="nav-links">
            <li><a href="#gpa-calculator" class="nav-item active" data-section="gpa-calculator">GPA Calculator</a></li>
            <li><a href="#study-timer" class="nav-item" data-section="study-timer">Study Timer</a></li>
            <li><button id="dark-mode-toggle" class="btn-toggle">🌙 Dark Mode</button></li>
        </ul>
    </nav>

    <div class="app-container">
        <aside class="sidebar">
            <h3>Upcoming Events</h3>
            <ul class="event-list">
                <li class="event-item">
                    <span class="event-date">Mar 12</span>
                    <span class="event-name">Math Quiz</span>
                </li>
                <li class="event-item">
                    <span class="event-date">Mar 15</span>
                    <span class="event-name">Project Submission</span>
                </li>
                <li class="event-item">
                    <span class="event-date">Mar 20</span>
                    <span class="event-name">Final Exams Start</span>
                </li>
            </ul>
        </aside>

        <main class="main-content">
            <!-- GPA Calculator Section -->
            <section id="gpa-calculator" class="content-section fade-in">
                <div class="section-header">
                    <h1>GPA Calculator</h1>
                    <p>Enter your course data below (one course per line).</p>
                </div>
                <div class="card">
                    <label for="gpa-input">Type: Credits, Grade (e.g., 3, 4.0)</label>
                    <textarea id="gpa-input" placeholder="3, 4.0&#10;4, 3.5&#10;2, 3.0"></textarea>
                    <button id="calculate-gpa" class="btn primary">Calculate Overall GPA</button>
                    <div id="gpa-result" class="result-display"></div>
                </div>
            </section>

            <!-- Study Timer Section -->
            <section id="study-timer" class="content-section hidden fade-in">
                <div class="section-header">
                    <h1>Study Timer</h1>
                    <p>Focus with the Pomodoro technique (25 minutes).</p>
                </div>
                <div class="card">
                    <div id="timer-display" class="timer-display">25:00</div>
                    <div class="timer-controls">
                        <button id="start-timer" class="btn primary">Start</button>
                        <button id="reset-timer" class="btn secondary">Reset</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <audio id="bell-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
